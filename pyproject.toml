[project]
name = "aim"
version = "0.1.0"
description = "나의 AI 투자 매니저 — KR/US 정시 리포트, 전략 시뮬레이션, 근거 Q&A"
requires-python = ">=3.11"
dependencies = [
    "pykrx>=1.0.48",
    "yfinance>=0.2",
    "pandas>=2.0",
    "python-telegram-bot>=20",
    "discord.py>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "APScheduler>=3.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
aim = "aim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aim = ["web/*.html"]

[tool.ruff]
line-length = 100
src = ["src"]
